server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health

ai:
  provider: ${AI_PROVIDER:ollama}

ollama:
  url: ${OLLAMA_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:qwen2.5:7b-instruct-q4_K_M}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

retrieval:
  service:
    url: ${RETRIEVAL_SERVICE_URL:http://localhost:8083}

weather:
  api:
    key: ${WEATHER_API_KEY:}
