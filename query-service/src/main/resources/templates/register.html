<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Farmer Registration — Kisan AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/i18n.css}" href="/css/i18n.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23059669'%3E%3Cpath d='M12 2L8 6c-3 3-4 7-2 11s7 5 11 2c2-2 3-6 2-11L12 2z'/%3E%3Cpath d='M12 2v20' stroke='%23ffffff' stroke-width='2'/%3E%3C/svg%3E">
    <style>
        :root {
            --primary-900: #064e3b;
            --primary-800: #065f46;
            --primary-700: #047857;
            --primary-600: #059669;
            --primary-50: #ecfdf5;
            --earth-900: #1c1917;
            --earth-700: #44403c;
            --earth-200: #e7e5e4;
            --earth-100: #f5f5f4;
            --error-red: #b91c1c;
            --error-bg: #fef2f2;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Public Sans', system-ui, sans-serif;
            background: linear-gradient(180deg, #ecfdf5 0%, #fafaf9 360px, #f5f5f4 100%);
            color: var(--earth-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--earth-200);
            box-shadow: var(--shadow-card);
            padding: 36px 32px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-900));
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary-900); margin-bottom: 6px; }
        .subtitle { font-size: 0.9375rem; color: var(--earth-700); }

        .alert-error {
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            margin-bottom: 20px;
            background: var(--error-bg);
            color: var(--error-red);
            border: 1px solid var(--error-border);
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--earth-700);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 11px 14px;
            font-family: inherit;
            font-size: 0.9375rem;
            color: var(--earth-900);
            background: var(--earth-100);
            border: 1.5px solid var(--earth-200);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.15s ease;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--primary-600);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-top: 14px;
            margin-bottom: 20px;
            font-size: 0.75rem;
            color: var(--earth-700);
            line-height: 1.4;
        }

        .checkbox-group input { margin-top: 2px; }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-900));
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .bottom-switch {
            text-align: center;
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--earth-200);
            font-size: 0.75rem;
            color: var(--earth-700);
        }

        .bottom-switch a { color: var(--primary-700); font-weight: 700; text-decoration: none; }
        .bottom-switch a:hover { text-decoration: underline; }

        /* Coarse pointer optimization for touchscreens */
        @media (pointer: coarse) {
            input[type="email"], input[type="password"], input[type="text"] {
                min-height: 48px;
            }
            .btn-submit {
                min-height: 48px;
            }
        }

        /* Hover vs Touch Active States */
        @media (hover: none) {
            .btn-submit:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
            .btn-submit:active {
                transform: scale(0.98);
            }
        }

        /* Motion Reduction */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="kisan-lang-container" style="display:flex; justify-content:center; margin-bottom:16px;"></div>
        <div class="brand-header">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                    <circle cx="8.5" cy="7.5" r="4"/>
                    <line x1="20" y1="8" x2="20" y2="14"/>
                    <line x1="23" y1="11" x2="17" y2="11"/>
                </svg>
            </div>
            <h1 data-i18n="auth_register_title">Create Farmer Profile</h1>
            <p class="subtitle" data-i18n="auth_register_subtitle">Store your land parcels, crop history, and personalized advisories</p>
        </div>

        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="fullName" data-i18n="auth_fullname_label">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="e.g. Ramesh Kumar" required autofocus />
            </div>

            <div class="form-group">
                <label for="email" data-i18n="auth_email_label">Email Address</label>
                <input type="email" id="email" name="email" placeholder="ramesh@kisan.in" required />
            </div>

            <div class="form-group">
                <label for="phone" data-i18n="auth_phone_label">Phone Number (Optional)</label>
                <input type="text" id="phone" name="phone" placeholder="+91 9876543210" />
            </div>

            <div class="form-group">
                <label for="password" data-i18n="auth_new_password_label">Password (Minimum 8 Characters)</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8" />
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="consent" name="consentDataRetention" value="true" checked />
                <label for="consent" style="text-transform: none; font-weight: normal; margin-bottom: 0;" data-i18n="auth_consent">
                    I consent to Kisan AI storing my farm parcel data and query history for personalized agronomical follow-ups.
                </label>
            </div>

            <button type="submit" class="btn-submit" data-i18n="auth_btn_register">Register Account</button>
        </form>

        <div class="bottom-switch">
            <span data-i18n="auth_has_account">Already registered?</span> <a th:href="@{/login}" data-i18n="nav_login">Sign In</a> &bull; <a th:href="@{/}" data-i18n="auth_guest_mode">Guest Mode</a>
        </div>
    </div>
    <script th:src="@{/js/i18n.js}" src="/js/i18n.js"></script>
</body>
</html>
