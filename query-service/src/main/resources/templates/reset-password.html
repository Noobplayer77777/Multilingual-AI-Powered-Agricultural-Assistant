<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Set New Password — Kisan AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/i18n.css}" href="/css/i18n.css">
    <style>
        :root {
            --primary-900: #064e3b;
            --primary-800: #065f46;
            --primary-700: #047857;
            --primary-600: #059669;
            --primary-50: #ecfdf5;
            --earth-900: #1c1917;
            --earth-700: #44403c;
            --earth-200: #e7e5e4;
            --earth-100: #f5f5f4;
            --error-red: #b91c1c;
            --error-bg: #fef2f2;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Public Sans', system-ui, sans-serif;
            background: linear-gradient(180deg, #ecfdf5 0%, #fafaf9 360px, #f5f5f4 100%);
            color: var(--earth-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--earth-200);
            box-shadow: var(--shadow-card);
            padding: 36px 32px;
        }

        .brand-header { text-align: center; margin-bottom: 24px; }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-900));
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary-900); margin-bottom: 6px; }
        .subtitle { font-size: 0.9375rem; color: var(--earth-700); }

        .alert-error {
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            margin-bottom: 20px;
            background: var(--error-bg);
            color: var(--error-red);
            border: 1px solid var(--error-border);
        }

        .form-group { margin-bottom: 18px; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--earth-700);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.9375rem;
            color: var(--earth-900);
            background: var(--earth-100);
            border: 1.5px solid var(--earth-200);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.15s ease;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--primary-600);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-900));
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .bottom-switch {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--earth-200);
            font-size: 0.75rem;
            color: var(--earth-700);
        }

        .bottom-switch a { color: var(--primary-700); font-weight: 700; text-decoration: none; }
        .bottom-switch a:hover { text-decoration: underline; }

        /* Coarse pointer optimization for touchscreens */
        @media (pointer: coarse) {
            input[type="text"], input[type="password"] {
                min-height: 48px;
            }
            .btn-submit {
                min-height: 48px;
            }
        }

        /* Hover vs Touch Active States */
        @media (hover: none) {
            .btn-submit:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
            .btn-submit:active {
                transform: scale(0.98);
            }
        }

        /* Motion Reduction */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="brand-header">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
                </svg>
            </div>
            <div class="kisan-lang-container" style="display:flex; justify-content:center; margin-bottom:16px;"></div>
            <h1 data-i18n="auth_reset_title">Set New Password</h1>
            <p class="subtitle" data-i18n="auth_reset_subtitle">Enter the verification token and your new password</p>
        </div>

        <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="token">Reset Token</label>
                <input type="text" id="token" name="token" th:value="${token}" placeholder="32-character token" required />
            </div>

            <div class="form-group">
                <label for="newPassword" data-i18n="auth_new_password_label">New Password (Min. 8 characters)</label>
                <input type="password" id="newPassword" name="newPassword" placeholder="••••••••" required minlength="8" />
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required minlength="8" />
            </div>

            <button type="submit" class="btn-submit" data-i18n="auth_btn_reset_submit">Update Password</button>
        </form>

        <div class="bottom-switch">
            <a th:href="@{/login}" data-i18n="auth_back_login">Back to Sign In</a>
        </div>
    </div>
    <script th:src="@{/js/i18n.js}" src="/js/i18n.js"></script>
</body>
</html>
