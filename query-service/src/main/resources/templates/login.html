<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Farmer Sign In — Kisan AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/i18n.css}" href="/css/i18n.css">
    <style>
        :root {
            --primary-900: #064e3b;
            --primary-800: #065f46;
            --primary-700: #047857;
            --primary-600: #059669;
            --primary-50: #ecfdf5;
            --earth-900: #1c1917;
            --earth-700: #44403c;
            --earth-200: #e7e5e4;
            --earth-100: #f5f5f4;
            --error-red: #b91c1c;
            --error-bg: #fef2f2;
            --success-green: #065f46;
            --success-bg: #d1fae5;
            --radius-lg: 16px;
            --radius-md: 10px;
            --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Public Sans', system-ui, sans-serif;
            background: linear-gradient(180deg, #ecfdf5 0%, #fafaf9 360px, #f5f5f4 100%);
            color: var(--earth-900);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
            -webkit-text-size-adjust: 100%;
            touch-action: manipulation;
        }

        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--earth-200);
            box-shadow: var(--shadow-card);
            padding: 36px 32px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-900));
            border-radius: var(--radius-md);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            margin-bottom: 12px;
        }

        h1 { font-size: 1.5rem; font-weight: 800; color: var(--primary-900); margin-bottom: 6px; }
        .subtitle { font-size: 0.9375rem; color: var(--earth-700); }

        .alert {
            padding: 12px 14px;
            border-radius: var(--radius-md);
            font-size: 0.9375rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .alert-error { background: var(--error-bg); color: var(--error-red); border: 1px solid var(--error-border); }
        .alert-success { background: var(--success-bg); color: var(--success-green); border: 1px solid #a7f3d0; }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--earth-700);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="email"], input[type="password"], input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.9375rem;
            color: var(--earth-900);
            background: var(--earth-100);
            border: 1.5px solid var(--earth-200);
            border-radius: var(--radius-md);
            outline: none;
            transition: all 0.15s ease;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--primary-600);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
        }

        .form-footer-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            margin-bottom: 22px;
            font-size: 0.75rem;
        }

        .form-footer-links a {
            color: var(--primary-700);
            text-decoration: none;
            font-weight: 600;
        }
        .form-footer-links a:hover { text-decoration: underline; }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary-700), var(--primary-900));
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: var(--shadow-sm);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .bottom-switch {
            text-align: center;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid var(--earth-200);
            font-size: 0.75rem;
            color: var(--earth-700);
        }

        .bottom-switch a {
            color: var(--primary-700);
            font-weight: 700;
            text-decoration: none;
        }
        .bottom-switch a:hover { text-decoration: underline; }

        /* Coarse pointer optimization for touchscreens */
        @media (pointer: coarse) {
            input[type="email"], input[type="password"], input[type="text"] {
                min-height: 48px;
            }
            .btn-submit {
                min-height: 48px;
            }
        }

        /* Hover vs Touch Active States */
        @media (hover: none) {
            .btn-submit:hover {
                transform: none;
                box-shadow: var(--shadow-sm);
            }
            .btn-submit:active {
                transform: scale(0.98);
            }
        }

        /* Motion Reduction */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="kisan-lang-container" style="display:flex; justify-content:center; margin-bottom:16px;"></div>
        <div class="brand-header">
            <div class="brand-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2L8 6c-3 3-4 7-2 11s7 5 11 2c2-2 3-6 2-11L12 2z"/>
                    <path d="M12 2v20"/>
                </svg>
            </div>
            <h1 data-i18n="auth_login_title">Farmer Sign In</h1>
            <p class="subtitle" data-i18n="auth_login_subtitle">Access your personalized plots, reminders, and farm plans</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="form-group">
                <label for="email" data-i18n="auth_email_label">Registered Email</label>
                <input type="email" id="email" name="email" placeholder="farmer@kisan.in" required autofocus autocomplete="email" />
            </div>

            <div class="form-group">
                <label for="password" data-i18n="auth_password_label">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
            </div>

            <div class="form-footer-links">
                <a th:href="@{/forgot-password}" data-i18n="auth_forgot_link">Forgot password?</a>
                <a th:href="@{/}" data-i18n="auth_guest_chat">Return to Guest Chat</a>
            </div>

            <button type="submit" class="btn-submit" data-i18n="auth_btn_login">Sign In to Farm Dashboard</button>
        </form>

        <div class="bottom-switch">
            <span data-i18n="auth_no_account">New farmer?</span> <a th:href="@{/register}" data-i18n="auth_register_link">Create an account</a>
        </div>
    </div>
    <script th:src="@{/js/i18n.js}" src="/js/i18n.js"></script>
</body>
</html>
