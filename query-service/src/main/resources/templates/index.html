<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agricultural Assistant</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2ecc71; }
        .nav-links { text-align: center; margin-bottom: 20px; }
        .nav-links a { color: #2980b9; text-decoration: none; font-weight: bold; }
        .nav-links a:hover { text-decoration: underline; }
        #response-container { margin-top: 20px; display: none; padding: 15px; border-radius: 4px; }
        .success { background-color: #e8f8f5; border: 1px solid #1abc9c; }
        .error { background-color: #fadbd8; border: 1px solid #e74c3c; color: #c0392b; }
        .source-list { margin-top: 10px; padding-left: 20px; }
        .source-list li { margin-bottom: 5px; }
        .loading { display: none; text-align: center; font-weight: bold; margin-top: 10px; color: #f39c12; }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-links">
            <a href="/history">View Query History</a>
        </div>
        <h1>Farmer Assistant</h1>
        <form id="queryForm">
            <div class="form-group">
                <label for="question">Your Question</label>
                <textarea id="question" name="question" rows="4" required placeholder="e.g., What crop should I grow? / நான் என்ன பயிர் வளர்க்க வேண்டும்?"></textarea>
            </div>
            <div class="form-group">
                <label for="language">Language</label>
                <select id="language" name="language">
                    <option value="auto">Auto-detect (English/Tamil/Hindi)</option>
                    <option value="en">English</option>
                    <option value="ta">Tamil (தமிழ்)</option>
                    <option value="hi">Hindi (हिंदी)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="location">Location (Optional)</label>
                <input type="text" id="location" name="location" placeholder="e.g., Thanjavur">
            </div>
            <div class="form-group">
                <label for="season">Season (Optional)</label>
                <input type="text" id="season" name="season" placeholder="e.g., Kharif">
            </div>
            <button type="submit">Ask Assistant</button>
        </form>

        <div class="loading" id="loading">Processing your query...</div>

        <div id="response-container">
            <h3 id="response-title">Answer:</h3>
            <p id="response-answer"></p>
            <h4>Sources:</h4>
            <ul class="source-list" id="response-sources"></ul>
        </div>
    </div>

    <script>
        document.getElementById('queryForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const reqBody = {
                question: document.getElementById('question').value,
                language: document.getElementById('language').value,
                location: document.getElementById('location').value,
                season: document.getElementById('season').value,
                category: 'GENERAL'
            };

            const responseContainer = document.getElementById('response-container');
            const loading = document.getElementById('loading');
            
            responseContainer.style.display = 'none';
            loading.style.display = 'block';

            try {
                const response = await fetch('/api/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(reqBody)
                });

                const data = await response.json();
                loading.style.display = 'none';

                if (response.ok) {
                    responseContainer.className = 'success';
                    document.getElementById('response-title').textContent = 'Answer (Language: ' + data.language + '):';
                    document.getElementById('response-answer').textContent = data.answer;
                    
                    const sourcesList = document.getElementById('response-sources');
                    sourcesList.innerHTML = '';
                    if (data.sources && data.sources.length > 0) {
                        data.sources.forEach(s => {
                            const li = document.createElement('li');
                            if (s.url && s.url.length > 0) {
                                li.innerHTML = `<strong>${s.name}</strong> (${s.type}) - <a href="${s.url}" target="_blank">Link</a>`;
                            } else {
                                li.innerHTML = `<strong>${s.name}</strong> (${s.type})`;
                            }
                            sourcesList.appendChild(li);
                        });
                    } else {
                        sourcesList.innerHTML = '<li>No specific sources provided.</li>';
                    }
                } else {
                    responseContainer.className = 'error';
                    document.getElementById('response-title').textContent = 'Error';
                    document.getElementById('response-answer').textContent = data.message || 'Something went wrong processing your request.';
                    document.getElementById('response-sources').innerHTML = '';
                }
                
                responseContainer.style.display = 'block';

            } catch (error) {
                loading.style.display = 'none';
                responseContainer.className = 'error';
                responseContainer.style.display = 'block';
                document.getElementById('response-title').textContent = 'Error';
                document.getElementById('response-answer').textContent = 'Failed to connect to the server.';
                document.getElementById('response-sources').innerHTML = '';
            }
        });
    </script>
</body>
</html>
