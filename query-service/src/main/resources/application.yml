server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:agridb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:Getthe1cr}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  thymeleaf:
    cache: false
    prefix: classpath:/templates/

advisory-service:
  url: ${ADVISORY_URL:http://localhost:8082}
